#:schema node_modules/wrangler/config-schema.json
name = "pet-valley-store"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Real D1 database, already created in your Cloudflare account.
# `env.DB` is what src/lib/prisma.ts reads at runtime.
[[d1_databases]]
binding = "DB"
database_name = "pet-valley-db"
database_id = "e77f792c-5585-4cdd-828c-c6c2da777ad5"

# R2 bucket for uploaded product/variant images and videos.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "pet-valley-media"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# --- Secrets: DO NOT put real values here. Set them with:
#   npx wrangler secret put NEXTAUTH_SECRET
#   npx wrangler secret put PAYFAST_MERCHANT_ID
#   npx wrangler secret put PAYFAST_MERCHANT_KEY
#   npx wrangler secret put PAYFAST_PASSPHRASE
# --- Plain (non-secret) vars can go here or be set with `wrangler secret put` too:
[vars]
PAYFAST_MODE = "sandbox"
NEXTAUTH_URL = "https://pet-valley-store.muhammadrizwan665f.workers.dev"
NEXT_PUBLIC_SITE_URL = "https://pet-valley-store.muhammadrizwan665f.workers.dev"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
